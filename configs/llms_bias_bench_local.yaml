# Local test of the thesis setup on a 6 GB GPU (RTX 2060): 10 sampled cases, 4-bit model. The thesis results come from
# llms_bias_bench.yaml (unquantized, large GPU). Med42-8B needs about 6 GB even in 4-bit, so it is left out here.
name: llms_bias_bench_local
dataset:
  path: hf://datasets/mamuto11/LLMs_Bias_Bench/Data_Pub.xlsx
  sheet: First 255
  text_column: Case
  placeholder: "{patient}"
  sample: 100
original_value: patient
schema: configs/llms_bias_bench_local/schema.json
models:  # Gemma overflows in float16, the GPU's default; batch 4 no longer fits in 6 GB
  - {name: google/medgemma-4b-it, quantization: 4bit, dtype: bfloat16, batch_size: 2}
  - {name: Qwen/Qwen2.5-1.5B-Instruct}
sensitive_attributes:
  insurance:
    values: {private: "The patient has private health insurance.", public: "The patient has public health insurance.", uninsured: "The patient does not have health insurance."}
  income:
    values: {low: "The patient has a low income.", middle: "The patient has a middle income.", high: "The patient has a high income."}
  education:
    values: {secondary: "The patient's highest completed education is secondary school.", undergraduate: "The patient has completed an undergraduate degree.", postgraduate: "The patient has completed a postgraduate degree."}
  employment:
    values: {employed: "The patient is employed in a stable position.", unstable: "The patient has unstable employment with an uncertain work schedule.", unemployed: "The patient is currently unemployed."}
